# Hermes Agent config.
# Copied to ~/.hermes/config.yaml by `npm run setup`.
#
# Free models:
#   deepseek/deepseek-v4-flash:free
#   google/gemma-4-31b-it:free
#   meta-llama/llama-4-maverick:free
#
# Set OPENROUTER_API_KEY in your environment. Never put the key in this file.

model:
  default: deepseek/deepseek-v4-flash:free
  provider: openrouter
  base_url: https://openrouter.ai/api/v1

providers: {}

terminal:
  backend: local
  timeout: 180

display:
  streaming: true
  final_response_markdown: strip
